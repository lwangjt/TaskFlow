apiVersion: v1
kind: ServiceAccount
metadata:
  name: taskflow
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: taskflow-job-manager
  namespace: default
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: taskflow-job-manager
  namespace: default
subjects:
  - kind: ServiceAccount
    name: taskflow
    namespace: default
roleRef:
  kind: Role
  name: taskflow-job-manager
  apiGroup: rbac.authorization.k8s.io